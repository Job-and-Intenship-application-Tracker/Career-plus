server.port=8080

# Route 1: Auth Microservice (Port 8081)
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Route 2: Application Microservice - Applications Endpoint (Port 8082)
spring.cloud.gateway.routes[1].id=applications-route
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/applications/**

# Route 3: Application Microservice - Users & Resumes Endpoint (Port 8082)
spring.cloud.gateway.routes[2].id=users-route
spring.cloud.gateway.routes[2].uri=http://localhost:8082
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/users/**

# Route 4: Application Microservice - Actions Endpoint (Port 8082)
spring.cloud.gateway.routes[3].id=actions-route
spring.cloud.gateway.routes[3].uri=http://localhost:8082
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/actions/**

# Route 5: Application Microservice - Analytics Endpoint (Port 8082)
spring.cloud.gateway.routes[4].id=analytics-route
spring.cloud.gateway.routes[4].uri=http://localhost:8082
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/analytics/**

# Global CORS Configuration for React Frontend (Port 3000)
spring.cloud.gateway.globalcors.cors-configurations.[*].allowed-origins=*
spring.cloud.gateway.globalcors.cors-configurations.[*].allowed-methods=*
spring.cloud.gateway.globalcors.cors-configurations.[*].allowed-headers=*
